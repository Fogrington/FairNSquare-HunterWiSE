name: Backend tests

on:
  push:
    paths: ['fairnsquare-backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['fairnsquare-backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fairn2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: fairnsquare-backend
    env:
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fairnsquare-backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage
